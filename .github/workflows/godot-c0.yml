name: KubRogue C0-C6 - Godot 4.7.2 validation

on:
  push:
    branches:
      - main
      - 'dev/checkpoint-**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot 4.7.2 (same version as Kubos)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot.zip" | sha256sum -c -
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: C4 fresh-clone boot (without generated Godot class cache)
        shell: bash
        run: |
          set -eo pipefail
          # Reproduce 'godot .' immediately after git clone, before the editor
          # has generated a .godot/ global-class cache.
          rm -rf .godot
          timeout 45s godot --headless --path . --quit-after 12 2>&1 | tee /tmp/c4-clean-boot.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|GDScript backtrace|ERROR:|Failed to load script' /tmp/c4-clean-boot.log; then exit 1; fi

      - name: C5 cold-start gameplay and raw PNG sprites (before editor import)
        shell: bash
        run: |
          set -eo pipefail
          test -f assets/c5/hand_open.png
          test -f assets/c5/hand_grip.png
          timeout 65s godot --headless --path . --script res://tests/integration/test_c5_cold_start.gd 2>&1 | tee /tmp/c5-cold-game.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|GDScript backtrace|ERROR:|C5 COLD FAIL:' /tmp/c5-cold-game.log; then exit 1; fi

      - name: C6 first-run hub and daily game before import
        shell: bash
        run: |
          set -eo pipefail
          timeout 75s godot --headless --path . --script res://tests/integration/test_c6_cold_start.gd 2>&1 | tee /tmp/c6-cold.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|GDScript backtrace|ERROR:|C6 COLD FAIL:' /tmp/c6-cold.log; then exit 1; fi

      - name: Import project and compile scripts
        shell: bash
        run: |
          set -eo pipefail
          godot --headless --editor --path . --import --quit 2>&1 | tee /tmp/c0-import.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|GDScript backtrace|ERROR:|C0 FALHOU:|FALHOU:' /tmp/c0-import.log; then exit 1; fi

      - name: Domain invariant tests from Kubos
        run: timeout 90s godot --headless --path . --script res://tests/unit/test_cube_state.gd

      - name: Cubie geometry and layer animation integration
        run: timeout 90s godot --headless --path . --script res://tests/integration/test_c0_cube.gd

      - name: C1 2x2 integer domain invariants
        run: timeout 90s godot --headless --path . --script res://tests/unit/test_cube_state_2x2.gd

      - name: C1 visual cubie geometry and animated layer rotations
        run: timeout 90s godot --headless --path . --script res://tests/integration/test_c1_cube_2x2.gd

      - name: C1 stage loop and provisional reward idempotence
        run: timeout 90s godot --headless --path . --script res://tests/integration/test_c1_stage.gd

      - name: C2 wallet, wave timing, missed-cube and restart invariants
        run: timeout 90s godot --headless --path . --script res://tests/unit/test_c2_rules.gd

      - name: C2 multi-actor wave scene and rewards
        run: timeout 120s godot --headless --path . --script res://tests/integration/test_c2_stage.gd

      - name: C3 five waves, elite spawn, progression and rewards
        run: timeout 90s godot --headless --path . --script res://tests/unit/test_c3_rules.gd

      - name: C3 playable scene, card pause and real boss rotations
        run: timeout 120s godot --headless --path . --script res://tests/integration/test_c3_stage.gd

      - name: C4 durable wallet, meta shop, recovery and settings
        run: timeout 90s godot --headless --path . --script res://tests/unit/test_c4_progress.gd

      - name: C4 hub, tutorial and persistent in-game coins
        run: timeout 120s godot --headless --path . --script res://tests/integration/test_c4_hub_game.gd

      - name: C5 original PCM audio, live volume and lightweight visuals
        run: timeout 90s godot --headless --path . --script res://tests/unit/test_c5_audio_visual.gd

      - name: C5 hub, fast field and real rewards
        run: timeout 120s godot --headless --path . --script res://tests/integration/test_c5_game.gd

      - name: C6 UTC daily records and deterministic reroll
        run: timeout 90s godot --headless --path . --script res://tests/unit/test_c6_daily.gd

      - name: C6 daily hub, real cubes and saved earnings
        run: timeout 120s godot --headless --path . --script res://tests/integration/test_c6_game.gd

      - name: Windows Desktop export preset validation
        shell: bash
        run: |
          test -f export_presets.cfg
          grep -Fq 'name="Windows Desktop"' export_presets.cfg
          grep -Fq 'platform="Windows Desktop"' export_presets.cfg
          test -f .github/workflows/windows-export.yml

      - name: Boot C6 hub scene
        shell: bash
        run: |
          set -eo pipefail
          godot --headless --path . --quit-after 40 2>&1 | tee /tmp/c0-boot.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|GDScript backtrace|ERROR:|C0 FALHOU:|C1.*FAIL:|C2.*FAIL:|C3.*FAIL:|C4.*FAIL:|C5.*FAIL:|C6.*FAIL:' /tmp/c0-boot.log; then exit 1; fi
