name: KubRogue C0-C10 + Audit - Godot 4.7.2 validation

on:
  push:
    branches:
      - main
      - 'dev/checkpoint-**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot 4.7.2 (same version as Kubos)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot.zip" | sha256sum -c -
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: C4 fresh-clone boot (without generated Godot class cache)
        shell: bash
        run: |
          set -eo pipefail
          # Reproduce 'godot .' immediately after git clone, before the editor
          # has generated a .godot/ global-class cache.
          rm -rf .godot
          timeout 45s godot --headless --path . --quit-after 12 2>&1 | tee /tmp/c4-clean-boot.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|GDScript backtrace|ERROR:|Failed to load script' /tmp/c4-clean-boot.log; then exit 1; fi

      - name: C5 cold-start gameplay and raw PNG sprites (before editor import)
        shell: bash
        run: |
          set -eo pipefail
          test -f assets/c5/hand_open.png
          test -f assets/c5/hand_grip.png
          timeout 65s godot --headless --path . --script res://tests/integration/test_c5_cold_start.gd 2>&1 | tee /tmp/c5-cold-game.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|GDScript backtrace|ERROR:|C5 COLD FAIL:' /tmp/c5-cold-game.log; then exit 1; fi

      - name: C6 first-run hub and daily game before import
        shell: bash
        run: |
          set -eo pipefail
          timeout 75s godot --headless --path . --script res://tests/integration/test_c6_cold_start.gd 2>&1 | tee /tmp/c6-cold.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|GDScript backtrace|ERROR:|C6 COLD FAIL:' /tmp/c6-cold.log; then exit 1; fi

      - name: C7 fresh game and PNGs before editor import
        shell: bash
        run: |
          set -eo pipefail
          timeout 75s godot --headless --path . --script res://tests/integration/test_c7_cold_start.gd 2>&1 | tee /tmp/c7-cold.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|GDScript backtrace|ERROR:|C7 COLD FAIL:' /tmp/c7-cold.log; then exit 1; fi

      - name: C8 cold boot and journal before editor import
        shell: bash
        run: |
          set -eo pipefail
          timeout 75s godot --headless --path . --script res://tests/integration/test_c8_cold_start.gd 2>&1 | tee /tmp/c8-cold.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR:|C8 COLD FAIL:' /tmp/c8-cold.log; then exit 1; fi

      - name: C9 first run and route overlay before Godot editor import
        shell: bash
        run: |
          set -eo pipefail
          timeout 90s godot --headless --path . --script res://tests/integration/test_c9_cold_start.gd 2>&1 | tee /tmp/c9-cold.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR:|C9 COLD FAIL:' /tmp/c9-cold.log; then exit 1; fi

      - name: C10 fresh clone boots Fever HUD and legacy saves
        shell: bash
        run: |
          set -eo pipefail
          timeout 90s godot --headless --path . --script res://tests/integration/test_c10_cold_start.gd 2>&1 | tee /tmp/c10-cold.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR:|C10 COLD FAIL:' /tmp/c10-cold.log; then exit 1; fi

      - name: Import project and compile scripts
        shell: bash
        run: |
          set -eo pipefail
          godot --headless --editor --path . --import --quit 2>&1 | tee /tmp/c0-import.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|GDScript backtrace|ERROR:|C0 FALHOU:|FALHOU:' /tmp/c0-import.log; then exit 1; fi

      - name: Domain invariant tests from Kubos
        run: timeout 90s godot --headless --path . --script res://tests/unit/test_cube_state.gd

      - name: Cubie geometry and layer animation integration
        run: timeout 90s godot --headless --path . --script res://tests/integration/test_c0_cube.gd

      - name: C1 2x2 integer domain invariants
        run: timeout 90s godot --headless --path . --script res://tests/unit/test_cube_state_2x2.gd

      - name: C1 visual cubie geometry and animated layer rotations
        run: timeout 90s godot --headless --path . --script res://tests/integration/test_c1_cube_2x2.gd

      - name: C1 stage loop and provisional reward idempotence
        run: timeout 90s godot --headless --path . --script res://tests/integration/test_c1_stage.gd

      - name: C2 wallet, wave timing, missed-cube and restart invariants
        run: timeout 90s godot --headless --path . --script res://tests/unit/test_c2_rules.gd

      - name: C2 multi-actor wave scene and rewards
        run: timeout 120s godot --headless --path . --script res://tests/integration/test_c2_stage.gd

      - name: C3 five waves, elite spawn, progression and rewards
        run: timeout 90s godot --headless --path . --script res://tests/unit/test_c3_rules.gd

      - name: C3 playable scene, card pause and real boss rotations
        run: timeout 120s godot --headless --path . --script res://tests/integration/test_c3_stage.gd

      - name: C4 durable wallet, meta shop, recovery and settings
        run: timeout 90s godot --headless --path . --script res://tests/unit/test_c4_progress.gd

      - name: C4 hub, tutorial and persistent in-game coins
        run: timeout 120s godot --headless --path . --script res://tests/integration/test_c4_hub_game.gd

      - name: C5 original PCM audio, live volume and lightweight visuals
        run: timeout 90s godot --headless --path . --script res://tests/unit/test_c5_audio_visual.gd

      - name: C5 hub, fast field and real rewards
        run: timeout 120s godot --headless --path . --script res://tests/integration/test_c5_game.gd

      - name: C6 UTC daily records and deterministic reroll
        run: timeout 90s godot --headless --path . --script res://tests/unit/test_c6_daily.gd

      - name: C6 daily hub, real cubes and saved earnings
        run: timeout 120s godot --headless --path . --script res://tests/integration/test_c6_game.gd

      - name: C7 special-cube wave and payout tests
        run: timeout 90s godot --headless --path . --script res://tests/unit/test_c7_variants.gd

      - name: C7 real gold/armored 2x2 and persistent wallet
        run: timeout 120s godot --headless --path . --script res://tests/integration/test_c7_game.gd

      - name: C7 true 4x4 and 5x5 integer slices and animated geometry
        shell: bash
        run: |
          set -eo pipefail
          timeout 120s godot --headless --path . --script res://tests/unit/test_c7_nxn.gd 2>&1 | tee /tmp/c7-nxn.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR:|C7 NXN FAIL:' /tmp/c7-nxn.log; then exit 1; fi

      - name: C7 large cube payouts and real 4x4/5x5 resolutions
        shell: bash
        run: |
          set -eo pipefail
          timeout 150s godot --headless --path . --script res://tests/integration/test_c7_large_cubes.gd 2>&1 | tee /tmp/c7-large.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR:|C7 LARGE FAIL:' /tmp/c7-large.log; then exit 1; fi

      - name: C8 journal file, discovery dedup and contract payouts
        shell: bash
        run: |
          set -eo pipefail
          timeout 90s godot --headless --path . --script res://tests/unit/test_c8_journal.gd 2>&1 | tee /tmp/c8-unit.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR:|C8 UNIT FAIL:' /tmp/c8-unit.log; then exit 1; fi

      - name: C8 bestiary UI, four real solves and atomic contract reward
        shell: bash
        run: |
          set -eo pipefail
          timeout 150s godot --headless --path . --script res://tests/integration/test_c8_game.gd 2>&1 | tee /tmp/c8-game.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR:|C8 STAGE FAIL:' /tmp/c8-game.log; then exit 1; fi

      - name: C8 clean main menu and icon-based skill UI
        shell: bash
        run: |
          set -eo pipefail
          timeout 120s godot --headless --path . --script res://tests/integration/test_c8_ui.gd 2>&1 | tee /tmp/c8-ui.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR:|C8 UI FAIL:' /tmp/c8-ui.log; then exit 1; fi

      - name: C8.2 transactional coins and run-only upgrades
        shell: bash
        run: |
          set -eo pipefail
          timeout 90s godot --headless --path . --script res://tests/unit/test_c8_workshop.gd 2>&1 | tee /tmp/c82-workshop.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR:|C8 WORKSHOP FAIL:' /tmp/c82-workshop.log; then exit 1; fi

      - name: C8.2 new mode cards, gallery and working between-wave shop
        shell: bash
        run: |
          set -eo pipefail
          timeout 120s godot --headless --path . --script res://tests/integration/test_c8_ux.gd 2>&1 | tee /tmp/c82-ux.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR:|C8 UX FAIL:' /tmp/c82-ux.log; then exit 1; fi

      - name: C9 fixed-seed two-route offerings and one-wave invariants
        shell: bash
        run: |
          set -eo pipefail
          timeout 90s godot --headless --path . --script res://tests/unit/test_c9_routes.gd 2>&1 | tee /tmp/c9-routes.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR:|C9 UNIT FAIL:' /tmp/c9-routes.log; then exit 1; fi

      - name: C9 playable route selection, C8 workshop and preserved boss
        shell: bash
        run: |
          set -eo pipefail
          timeout 120s godot --headless --path . --script res://tests/integration/test_c9_game.gd 2>&1 | tee /tmp/c9-game.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR:|C9 STAGE FAIL:' /tmp/c9-game.log; then exit 1; fi

      - name: C10 streak thresholds, cooldown and bonus caps
        shell: bash
        run: |
          set -eo pipefail
          timeout 90s godot --headless --path . --script res://tests/unit/test_c10_fever.gd 2>&1 | tee /tmp/c10-unit.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR:|C10 UNIT FAIL:' /tmp/c10-unit.log; then exit 1; fi

      - name: C10 real cubes trigger Fever, contract and saved coins
        shell: bash
        run: |
          set -eo pipefail
          timeout 120s godot --headless --path . --script res://tests/integration/test_c10_game.gd 2>&1 | tee /tmp/c10-game.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR:|C10 STAGE FAIL:' /tmp/c10-game.log; then exit 1; fi

      - name: Audit - backup survives repeated primary-file corruption
        shell: bash
        run: |
          set -eo pipefail
          timeout 90s godot --headless --path . --script res://tests/unit/test_audit_save_recovery.gd 2>&1 | tee /tmp/audit-save.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR:|AUDIT SAVE FAIL:' /tmp/audit-save.log; then exit 1; fi

      - name: Audit - corrupt, unknown-schema and valid C4 wallet behavior
        shell: bash
        run: |
          set -eo pipefail
          timeout 90s godot --headless --path . --script res://tests/unit/test_audit_schema_guard.gd 2>&1 | tee /tmp/audit-schema.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR:|AUDIT SCHEMA FAIL:' /tmp/audit-schema.log; then exit 1; fi

      - name: Audit - Gregorian UTC dates and deterministic daily seed
        shell: bash
        run: |
          set -eo pipefail
          timeout 90s godot --headless --path . --script res://tests/unit/test_audit_calendar.gd 2>&1 | tee /tmp/audit-calendar.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR:|AUDIT CALENDAR FAIL:' /tmp/audit-calendar.log; then exit 1; fi

      - name: Audit - isolated daily and Bestiary saves are never silently overwritten
        shell: bash
        run: |
          set -eo pipefail
          timeout 90s godot --headless --path . --script res://tests/unit/test_audit_isolated_saves.gd 2>&1 | tee /tmp/audit-isolated.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR:|AUDIT ISOLATED SAVE FAIL:' /tmp/audit-isolated.log; then exit 1; fi

      - name: Windows Desktop export preset validation
        shell: bash
        run: |
          test -f export_presets.cfg
          grep -Fq 'name="Windows Desktop"' export_presets.cfg
          grep -Fq 'platform="Windows Desktop"' export_presets.cfg
          test -f .github/workflows/windows-export.yml

      - name: Boot stable C10 hub scene (audit)
        shell: bash
        run: |
          set -eo pipefail
          godot --headless --path . --quit-after 40 2>&1 | tee /tmp/c0-boot.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Compile Error:|GDScript backtrace|ERROR:|C0 FALHOU:|C1.*FAIL:|C2.*FAIL:|C3.*FAIL:|C4.*FAIL:|C5.*FAIL:|C6.*FAIL:|C7.*FAIL:|C8.*FAIL:|C9.*FAIL:|C10.*FAIL:' /tmp/c0-boot.log; then exit 1; fi
